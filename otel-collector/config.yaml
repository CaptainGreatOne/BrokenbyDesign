# OpenTelemetry Collector Configuration
# Production-realistic pipeline with batch processing, tail sampling, and attribute enrichment

receivers:
  otlp:
    protocols:
      http:
        endpoint: 0.0.0.0:4318
      grpc:
        endpoint: 0.0.0.0:4317

processors:
  # 1. Attribute enrichment - add deployment environment to all spans
  attributes:
    actions:
      - key: deployment.environment
        value: local
        action: insert

  # 2. Tail sampling - make sampling decisions after seeing complete trace
  # ORDER CRITICAL: Must come BEFORE batch processor (per research pitfall #5)
  tail_sampling:
    decision_wait: 10s
    num_traces: 10000
    expected_new_traces_per_sec: 100
    policies:
      # Always sample errors
      - name: errors
        type: status_code
        status_code:
          status_codes: [ERROR]
      # Always sample slow requests (>1s)
      - name: slow_requests
        type: latency
        latency:
          threshold_ms: 1000
      # Sample everything in learning environment (100% sampling)
      # In production this would be 10% or lower
      - name: probabilistic
        type: probabilistic
        probabilistic:
          sampling_percentage: 100

  # 3. Batch processor - group spans for efficient network usage
  # Must come AFTER tail_sampling to batch already-sampled traces
  batch:
    timeout: 10s
    send_batch_size: 1024
    send_batch_max_size: 2048

exporters:
  # Export to Jaeger via OTLP protocol (NOT deprecated jaeger exporter)
  otlp:
    endpoint: jaeger:4317
    tls:
      insecure: true

extensions:
  # Health check endpoint for Docker healthcheck
  health_check:
    endpoint: 0.0.0.0:13133

service:
  extensions: [health_check]
  pipelines:
    traces:
      receivers: [otlp]
      processors: [attributes, tail_sampling, batch]
      exporters: [otlp]

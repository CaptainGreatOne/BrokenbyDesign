global:
  resolve_timeout: 5m

route:
  receiver: 'all-receivers'
  group_by: ['alertname', 'service']
  group_wait: 10s
  group_interval: 5m
  repeat_interval: 4h

  routes:
    - match:
        severity: critical
      receiver: 'critical-receivers'
      group_wait: 5s
      group_interval: 2m
      repeat_interval: 1h

receivers:
  - name: 'all-receivers'
    webhook_configs:
      - url: 'http://webhook-receiver:5001/alerts'
        send_resolved: true
      - url: 'http://mock-slack-ui:8080/webhook'
        send_resolved: true

  - name: 'critical-receivers'
    webhook_configs:
      - url: 'http://webhook-receiver:5001/alerts'
        send_resolved: true
      - url: 'http://mock-slack-ui:8080/webhook'
        send_resolved: true

inhibit_rules: []
